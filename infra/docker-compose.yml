networks:
  claude_orchestrator:
    driver: bridge

volumes:
  claude_postgres_data:
  claude_qdrant_data:
  claude_redis_data:

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — for Langfuse
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: claude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - claude_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - claude_orchestrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Langfuse — Observability UI + API
  # ─────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: claude-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - claude_orchestrator
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      # Auto-initialize org, project, user on first start
      LANGFUSE_INIT_ORG_ID: default-org
      LANGFUSE_INIT_ORG_NAME: Local
      LANGFUSE_INIT_PROJECT_ID: default-project
      LANGFUSE_INIT_PROJECT_NAME: claude-orchestrator
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@local.dev
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin1234
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"

  # ─────────────────────────────────────────────
  # Qdrant — Vector DB for RAG
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: claude-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - claude_qdrant_data:/qdrant/storage
    networks:
      - claude_orchestrator

  # ─────────────────────────────────────────────
  # Redis — Budget tracking + pub/sub
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: claude-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - claude_redis_data:/data
    networks:
      - claude_orchestrator

  # ─────────────────────────────────────────────
  # NATS — Inter-agent messaging (JetStream)
  # ─────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: claude-nats
    restart: unless-stopped
    command: "-js -m 8222"
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    networks:
      - claude_orchestrator
